spring.application.name=tfhub-api
#DB
spring.datasource.url=jdbc:postgresql://localhost:5432/tfhub
spring.datasource.username=tfhub
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:TFHUBSESSION}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=${TFHUB_TRAINING_IMPORT_MAX_UPLOAD_SIZE:15MB}
spring.servlet.multipart.max-request-size=${TFHUB_TRAINING_IMPORT_MAX_REQUEST_SIZE:16MB}
tfhub.training-import.storage-path=${TFHUB_TRAINING_IMPORT_STORAGE_PATH:./data/training-imports}
tfhub.training-import.max-upload-size=${TFHUB_TRAINING_IMPORT_MAX_UPLOAD_SIZE:15MB}
tfhub.training-import.max-image-width=${TFHUB_TRAINING_IMPORT_MAX_IMAGE_WIDTH:8000}
tfhub.training-import.max-image-height=${TFHUB_TRAINING_IMPORT_MAX_IMAGE_HEIGHT:8000}
tfhub.training-import.max-image-pixels=${TFHUB_TRAINING_IMPORT_MAX_IMAGE_PIXELS:24000000}
backup.temporary-directory=${TFHUB_BACKUP_TEMP_DIRECTORY:/tmp}
backup.rclone-executable=${TFHUB_BACKUP_RCLONE_EXECUTABLE:rclone}
backup.rclone-config=${RCLONE_CONFIG:/run/secrets/rclone.conf}
backup.rclone-remote=${TFHUB_BACKUP_RCLONE_REMOTE:tfhub-crypt}
backup.rclone-path=${TFHUB_BACKUP_RCLONE_PATH:.}
backup.command-timeout-seconds=${TFHUB_BACKUP_COMMAND_TIMEOUT_SECONDS:600}
backup.retention-count=3
