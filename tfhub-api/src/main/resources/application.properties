spring.application.name=tfhub-api
#DB
spring.datasource.url=jdbc:postgresql://localhost:5432/tfhub
spring.datasource.username=tfhub
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.timeout=2h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/
server.servlet.session.cookie.name=${SESSION_COOKIE_NAME:TFHUBSESSION}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
