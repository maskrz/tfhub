
services:
  postgres:
    image: postgres:17
    container_name: tfhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tfhub
      POSTGRES_USER: tfhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tfhub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfhub -d tfhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tfhub-postgres-data:
