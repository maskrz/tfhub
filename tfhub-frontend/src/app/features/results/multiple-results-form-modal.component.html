<dialog #dialog class="modal" aria-labelledby="multiple-modal-title" (cancel)="onDialogCancel($event)">
  <div class="modal-header">
    <h2 id="multiple-modal-title">Dodaj wiele wyników</h2>
    <button
      type="button"
      class="button button--icon close-button"
      aria-label="Anuluj i zamknij okno"
      [disabled]="saving()"
      (click)="cancel()"
    >
      ×
    </button>
  </div>

  <div class="modal-content">
    <app-multiple-results-form
      [athletes]="athletes"
      [tests]="tests"
      (saved)="onSaved($event)"
      (savingChange)="saving.set($event)"
    />
  </div>

  <footer class="modal-footer">
    <button type="button" class="button button--secondary cancel-button" [disabled]="saving()" (click)="cancel()">
      Anuluj
    </button>
    <button
      type="submit"
      form="multiple-results-form"
      class="button button--primary save-button"
      [disabled]="saving()"
    >
      {{ saving() ? 'Zapisywanie...' : 'Zapisz wyniki' }}
    </button>
  </footer>
</dialog>
