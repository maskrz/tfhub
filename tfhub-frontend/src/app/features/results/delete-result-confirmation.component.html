<dialog #dialog class="confirmation-modal" aria-labelledby="delete-result-title" (cancel)="onDialogCancel($event)">
  <header class="modal-header">
    <h2 id="delete-result-title">Usuń wynik</h2>
  </header>

  <div class="modal-content">
    <dl class="result-details">
      <div>
        <dt>Zawodnik</dt>
        <dd>{{ result.athleteName }}</dd>
      </div>
      <div>
        <dt>Test</dt>
        <dd>{{ result.testName }}</dd>
      </div>
      <div>
        <dt>Wynik</dt>
        <dd>{{ formattedValue }} {{ result.unit }}</dd>
      </div>
      <div>
        <dt>Data</dt>
        <dd>{{ formattedDate }}</dd>
      </div>
      <div>
        <dt>Rodzaj</dt>
        <dd>{{ resultType }}</dd>
      </div>
    </dl>

    <p class="confirmation-message">Czy na pewno chcesz usunąć ten wynik? Tej operacji nie można cofnąć.</p>

    @if (errorMessage(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }
  </div>

  <footer class="modal-footer">
    <button type="button" class="button button--secondary" [disabled]="deleting()" (click)="cancel()">
      Anuluj
    </button>
    <button type="button" class="button button--danger" [disabled]="deleting()" (click)="confirm()">
      {{ deleting() ? 'Usuwanie...' : 'Usuń' }}
    </button>
  </footer>
</dialog>
