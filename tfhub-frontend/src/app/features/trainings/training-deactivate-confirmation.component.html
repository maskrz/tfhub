<dialog #dialog class="confirmation-modal" aria-labelledby="deactivate-training-title" (cancel)="onDialogCancel($event)">
  <header class="modal-header">
    <h2 id="deactivate-training-title">Dezaktywuj trening</h2>
  </header>

  <div class="modal-content">
    <p class="training-name">{{ trainingName }}</p>
    <p class="confirmation-message">
      Trening zniknie z aktywnych list, ale wszystkie jego dane — podgrupy, odcinki, zawodnicy i wyniki — zostaną zachowane.
      Tej operacji nie można cofnąć w aplikacji.
    </p>

    @if (errorMessage(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }
  </div>

  <footer class="modal-footer">
    <button type="button" class="button button--secondary" [disabled]="deactivating()" (click)="cancel()">
      Anuluj
    </button>
    <button type="button" class="button button--danger" [disabled]="deactivating()" (click)="confirm()">
      {{ deactivating() ? 'Dezaktywowanie...' : 'Dezaktywuj' }}
    </button>
  </footer>
</dialog>
