<dialog #dialog class="modal" aria-labelledby="password-modal-title" (cancel)="onDialogCancel($event)">
  <div class="modal-header">
    <h2 id="password-modal-title">Zmień hasło: {{ account.username }}</h2>
    <button
      type="button"
      class="button button--icon"
      aria-label="Anuluj i zamknij okno"
      [disabled]="saving()"
      (click)="cancel()"
    >×</button>
  </div>
  <div class="modal-content">
    <form id="reset-account-password-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      @if (errorMessage(); as message) {
        <p class="form-error" role="alert">{{ message }}</p>
      }
      <div class="field">
        <label for="account-new-password">Nowe hasło <span aria-hidden="true">*</span></label>
        <input
          id="account-new-password"
          class="field-control"
          type="password"
          autocomplete="new-password"
          formControlName="newPassword"
          [attr.aria-invalid]="fieldError('newPassword') ? 'true' : null"
          aria-describedby="account-new-password-error"
        />
        @if (fieldError('newPassword'); as message) {
          <span class="field-error" id="account-new-password-error">{{ message }}</span>
        }
      </div>
      <div class="field">
        <label for="account-repeat-password">Powtórz nowe hasło <span aria-hidden="true">*</span></label>
        <input
          id="account-repeat-password"
          class="field-control"
          type="password"
          autocomplete="new-password"
          formControlName="repeatPassword"
          [attr.aria-invalid]="fieldError('repeatPassword') ? 'true' : null"
          aria-describedby="account-repeat-password-error"
        />
        @if (fieldError('repeatPassword'); as message) {
          <span class="field-error" id="account-repeat-password-error">{{ message }}</span>
        }
      </div>
    </form>
  </div>
  <footer class="modal-footer">
    <button type="button" class="button button--secondary" [disabled]="saving()" (click)="cancel()">Anuluj</button>
    <button type="submit" form="reset-account-password-form" class="button button--primary" [disabled]="saving()">
      {{ saving() ? 'Zapisywanie...' : 'Zmień hasło' }}
    </button>
  </footer>
</dialog>
